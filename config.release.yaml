template:
  path: "templates/template.docx"

paper:
  title: ""
  single_count: 30
  multiple_count: 10
  judge_count: 30
  short_count: 5

output:
  dir: "~/Desktop"
  filename_pattern: "待命名试卷_{n}.docx"
  auto_volume_name: false

# 默认四个题库路径（可在组卷界面修改；也可改成绝对路径）
excel:
  single: "题库/单选.xls"
  multiple: "题库/多选.xls"
  judge: "题库/判断.xls"
  qa: "题库/问答.xls"

# 可选：多个题库文件夹，界面「快捷填充」可用
# banks:
#   操作初级: "C:/Users/你的用户名/Desktop/操作初级"
#   操作高级: "C:/Users/你的用户名/Desktop/操作高级"
# active_bank: "操作初级"
