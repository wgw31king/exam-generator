# 校验：单元测试 + 关键模块可导入 + 麒麟打包脚本完整性
name: CI Check

on:
  workflow_dispatch:
  push:
    branches: [main, master, feat/windows, feat/kylin-portable]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Import smoke check
        run: |
          python - <<'PY'
          import app, service, web_ui, ui, main, bank_resolver, assembler, renderer
          print("imports OK")
          PY

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Verify Kylin pack script
        run: |
          test -f scripts/build_kylin_arm_portable.sh
          grep -q 'web_ui.py' scripts/build_kylin_arm_portable.sh
          grep -q 'app.py' scripts/build_kylin_arm_portable.sh
          grep -q 'service.py' scripts/build_kylin_arm_portable.sh
          grep -q 'bank_resolver.py' scripts/build_kylin_arm_portable.sh
          grep -q '组卷.desktop' scripts/build_kylin_arm_portable.sh
          grep -q '首次使用-双击我.sh' scripts/build_kylin_arm_portable.sh
          grep -q 'start.sh' scripts/build_kylin_arm_portable.sh
          test -f config.kylin.yaml
          echo "kylin pack script OK"

      - name: Verify Windows pack pieces
        run: |
          test -f scripts/build_windows_portable.sh
          test -f scripts/windows_launcher/main.go
          test -f exam_generator.spec
          echo "windows pack pieces OK"
