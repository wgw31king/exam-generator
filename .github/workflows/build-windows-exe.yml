# 在 GitHub 的 Windows 机器上自动打出可双击的 .exe（免费用）
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master, feat/windows]
    paths:
      - "**.py"
      - "exam_generator.spec"
      - "requirements*.txt"
      - "config.release.yaml"
      - "templates/**"
      - ".github/workflows/build-windows-exe.yml"
      - "scripts/build_release.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build release folder + zip
        run: python scripts/build_release.py --zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: 组卷工具-Windows
          path: release/组卷工具-Windows.zip
          if-no-files-found: error
          retention-days: 30
